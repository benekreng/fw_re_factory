<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fw_re_factory</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>fw_re_factory</h1>
    <span id="sync" class="muted">Connecting…</span>
  </header>
  <div id="error" role="alert" hidden></div>
  <section class="launch-controls" aria-label="Launch controls">
    <div class="mode-control">
      <label for="launch-mode">Launch mode</label>
      <select id="launch-mode">
        <option value="manual">Manual</option>
        <option value="automatic">Automatic</option>
      </select>
      <span id="launch-mode-note" class="muted"></span>
    </div>
    <p id="action-status" role="status" aria-live="polite"></p>
  </section>
  <div id="stats" class="stats" aria-label="Run statistics"></div>

  <section id="queue">
    <div class="section-heading">
      <h2>Worker queue</h2>
      <label>Show <select id="filter">
        <option value="all">All jobs</option>
        <option value="active">Active</option>
        <option value="queued">Queued</option>
        <option value="verified_complete">Completed</option>
        <option value="attention">Needs attention</option>
      </select></label>
    </div>
    <div id="jobs"></div>
  </section>

  <section id="usage">
    <div class="section-heading">
      <h2>Account usage</h2>
      <span id="sample-time" class="muted">No samples yet</span>
    </div>
    <div id="accounts"></div>
    <details class="subsection">
      <summary>Usage history</summary>
      <div class="details-content">
        <label>Window <select id="window-filter">
          <option value="all">All windows</option>
          <option value="short">Short windows</option>
          <option value="weekly">Weekly windows</option>
        </select></label>
        <div id="chart" class="chart"></div>
        <div id="legend" class="legend"></div>
      </div>
    </details>
  </section>

  <div class="diagnostics">
    <details>
      <summary>Watcher and scheduling <span id="watch-state" class="muted">—</span></summary>
      <div class="details-content">
        <div id="watcher"></div>
        <h3>Scheduling <span id="policy" class="muted"></span></h3>
        <div id="admission"></div>
      </div>
    </details>
    <details>
      <summary>Completion reviews</summary>
      <div id="reviews" class="details-content"></div>
    </details>
    <details>
      <summary>Token usage</summary>
      <div id="tokens" class="details-content"></div>
    </details>
    <details id="recovery">
      <summary>Thread recovery <span id="recovery-state" class="muted">—</span></summary>
      <div id="recoveries" class="details-content"></div>
    </details>
    <details id="activity">
      <summary>Activity log</summary>
      <div id="events" class="details-content"></div>
    </details>
  </div>
  <footer>Updates every 15 seconds. Add jobs with <code>re-launch</code>.</footer>
</main>
</body>
</html>
